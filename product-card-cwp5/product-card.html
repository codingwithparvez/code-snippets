<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tidewater mug – product card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --page: #e3e8e2;
        --card: #fbfaf7;
        --ink: #1b2320;
        --muted: #6a756f;
        --line: #e4e2da;
        --font: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;

        /* default glaze: sea glass */
        --mug: #9fcdbd;
        --panel: #2142c4;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--page);
        color: var(--ink);
        font-family: var(--font);
      }

      /* glaze choice drives the whole card, with no JavaScript */
      .card:has(#g2:checked) {
        --mug: #dcd7cd;
        --panel: #4a2f6e;
      }
      .card:has(#g3:checked) {
        --mug: #ec7b4c;
        --panel: #0f5a4a;
      }

      .card {
        width: min(100%, 340px);
        padding: 10px 10px 24px;
        background: var(--card);
        border-radius: 30px;
        box-shadow:
          0 1px 0 #fff inset,
          0 2px 4px rgba(27, 35, 32, 0.06),
          0 24px 48px -16px rgba(27, 35, 32, 0.28);
      }

      /* ---------- visual ---------- */
      .stage {
        position: relative;
        height: 290px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background:
          radial-gradient(
            circle at 30% 20%,
            rgba(255, 255, 255, 0.22),
            transparent 55%
          ),
          var(--panel);
        transition: background-color 0.4s;
        overflow: hidden;
      }

      .tag {
        position: absolute;
        top: 14px;
        left: 14px;
        padding: 6px 12px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
        font-size: 12.5px;
        font-weight: 600;
        backdrop-filter: blur(6px);
      }

      .mug {
        --deep: color-mix(in srgb, var(--mug) 62%, #000);
        --lite: color-mix(in srgb, var(--mug) 70%, #fff);
        position: relative;
        width: 150px;
        height: 150px;
        margin-left: -40px;
        margin-top: 14px;
        transition: --mug 0.4s;
      }

      .mug .body {
        position: absolute;
        inset: 0;
        border-radius: 8px 8px 70px 70px;
        background:
          radial-gradient(
              circle at 24% 62%,
              rgba(0, 0, 0, 0.28) 0 1.2px,
              transparent 1.6px
            )
            0 0 / 17px 19px,
          radial-gradient(
              circle at 70% 30%,
              rgba(0, 0, 0, 0.2) 0 1px,
              transparent 1.4px
            )
            0 0 / 23px 15px,
          linear-gradient(
            100deg,
            var(--lite) 0%,
            var(--mug) 28%,
            var(--mug) 55%,
            var(--deep) 100%
          );
        box-shadow: inset -10px -14px 24px rgba(0, 0, 0, 0.18);
      }

      /* glossy highlight */
      .mug .body::after {
        content: "";
        position: absolute;
        left: 16px;
        top: 34px;
        width: 14px;
        height: 70px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.55);
        filter: blur(2px);
        transform: rotate(4deg);
      }

      /* rim and dark coffee-less opening */
      .mug .rim {
        position: absolute;
        left: -2px;
        right: -2px;
        top: -13px;
        height: 28px;
        border-radius: 50%;
        background: var(--lite);
        box-shadow: inset 0 -2px 3px rgba(0, 0, 0, 0.12);
      }
      .mug .rim::after {
        content: "";
        position: absolute;
        inset: 4px 7px 3px;
        border-radius: 50%;
        background: linear-gradient(
          180deg,
          var(--deep),
          color-mix(in srgb, var(--deep) 70%, #000)
        );
      }

      .mug .handle {
        position: absolute;
        right: -46px;
        top: 30px;
        width: 62px;
        height: 78px;
        border: 15px solid var(--mug);
        border-left: 0;
        border-radius: 0 54px 54px 0;
        box-shadow: inset -4px -4px 8px rgba(0, 0, 0, 0.2);
        z-index: -1;
      }

      .floor {
        position: absolute;
        bottom: 38px;
        left: 50%;
        width: 190px;
        height: 20px;
        margin-left: -112px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.3);
        filter: blur(9px);
      }

      /* ---------- copy ---------- */
      .info {
        padding: 22px 14px 0;
      }

      .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }

      .price {
        font-size: 22px;
        font-weight: 600;
      }

      .blurb {
        margin-top: 10px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
        max-width: 30ch;
      }

      .facts {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        padding: 0;
        list-style: none;
      }
      .facts li {
        padding: 6px 11px;
        border: 1px solid var(--line);
        border-radius: 99px;
        font-size: 13px;
        font-weight: 500;
      }

      /* ---------- glaze picker ---------- */
      fieldset {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 20px;
        padding: 16px 0 0;
        border: 0;
        border-top: 1px solid var(--line);
      }
      legend {
        display: contents;
      }
      .label {
        font-size: 14px;
        color: var(--muted);
        margin-right: auto;
      }

      .swatch input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
      .swatch span {
        display: block;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--c);
        box-shadow: inset 0 -3px 5px rgba(0, 0, 0, 0.18);
        outline: 2px solid transparent;
        outline-offset: 3px;
        cursor: pointer;
        transition: outline-color 0.2s;
      }
      .swatch input:checked + span {
        outline-color: var(--ink);
      }
      .swatch input:focus-visible + span {
        outline-color: var(--panel);
        outline-style: dashed;
      }

      /* ---------- action ---------- */
      .buy {
        display: block;
        width: 100%;
        margin-top: 18px;
        padding: 16px;
        border: 0;
        border-radius: 16px;
        background: var(--ink);
        color: #fff;
        font: 600 16px var(--font);
        text-align: center;
        text-decoration: none;
        transition:
          background-color 0.25s,
          transform 0.15s;
      }
      .buy:hover {
        background: var(--panel);
      }
      .buy:active {
        transform: scale(0.98);
      }
      .buy:focus-visible {
        outline: 3px solid var(--panel);
        outline-offset: 3px;
      }

      .ship {
        margin-top: 12px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <article class="card">
      <div class="stage">
        <span class="tag">Hand-thrown</span>
        <div class="floor"></div>
        <div class="mug" aria-hidden="true">
          <div class="handle"></div>
          <div class="body"></div>
          <div class="rim"></div>
        </div>
      </div>

      <div class="info">
        <div class="row">
          <h1>Tidewater mug</h1>
          <p class="price">$38</p>
        </div>
        <p class="blurb">
          Speckled stoneware with a thick, glossy glaze. Holds heat well and
          feels good in both hands.
        </p>

        <ul class="facts">
          <li>350 ml</li>
          <li>Dishwasher safe</li>
          <li>Microwave safe</li>
        </ul>

        <fieldset>
          <legend class="label">Glaze</legend>
          <span class="label" aria-hidden="true">Glaze</span>
          <label class="swatch" title="Sea glass">
            <input
              type="radio"
              name="glaze"
              id="g1"
              checked
              aria-label="Sea glass"
            />
            <span style="--c: #9fcdbd"></span>
          </label>
          <label class="swatch" title="Ash">
            <input type="radio" name="glaze" id="g2" aria-label="Ash" />
            <span style="--c: #dcd7cd"></span>
          </label>
          <label class="swatch" title="Persimmon">
            <input type="radio" name="glaze" id="g3" aria-label="Persimmon" />
            <span style="--c: #ec7b4c"></span>
          </label>
        </fieldset>

        <a class="buy" href="#">Add to cart</a>
        <p class="ship">Ships in 3 days. Free returns for 30 days.</p>
      </div>
    </article>
  </body>
</html>
