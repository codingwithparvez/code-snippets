<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Square product cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --page: #e8eaef;
        --font: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100vh;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(0, 300px));
        justify-content: center;
        align-content: center;
        gap: 24px;
        padding: 32px 20px;
        background: var(--page);
        font-family: var(--font);
      }

      /* ---------- shared square card ---------- */
      .card {
        position: relative;
        aspect-ratio: 1 / 1;
        width: 100%;
        overflow: hidden;
        border-radius: 28px;
        background: var(--bg);
        color: var(--fg);
        box-shadow: 0 18px 36px -18px rgba(20, 24, 40, 0.45);
      }

      .name {
        position: absolute;
        top: 22px;
        left: 24px;
        max-width: 12ch;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }

      .meta {
        position: absolute;
        left: 24px;
        bottom: 22px;
        font-size: 14px;
        opacity: 0.75;
      }
      .meta b {
        display: block;
        margin-bottom: 2px;
        font-size: 22px;
        font-weight: 600;
        opacity: 1;
        color: var(--fg);
      }

      .add {
        position: absolute;
        right: 20px;
        bottom: 20px;
        width: 46px;
        height: 46px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--fg);
        color: var(--bg);
        font-size: 26px;
        font-weight: 400;
        line-height: 1;
        text-decoration: none;
        transition: transform 0.2s;
      }
      .add:hover {
        transform: rotate(90deg);
      }
      .add:focus-visible {
        outline: 3px solid var(--fg);
        outline-offset: 3px;
      }

      .art {
        position: absolute;
        left: 50%;
        top: 52%;
        transform: translate(-50%, -50%);
      }

      /* ---------- 1. candle ---------- */
      .candle {
        --bg: #35193d;
        --fg: #f6e6d2;
        background:
          radial-gradient(
            circle at 50% 38%,
            rgba(255, 170, 80, 0.38),
            transparent 52%
          ),
          var(--bg);
      }
      .jar {
        width: 100px;
        height: 104px;
        margin-top: 22px;
        border: 2px solid rgba(255, 255, 255, 0.38);
        border-radius: 10px 10px 18px 18px;
        background: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.28),
          rgba(255, 255, 255, 0.04) 40%,
          rgba(0, 0, 0, 0.25)
        );
      }
      .jar::before {
        /* wax */
        content: "";
        position: absolute;
        left: 6px;
        right: 6px;
        bottom: 6px;
        top: 16px;
        border-radius: 6px 6px 12px 12px;
        background: linear-gradient(90deg, #f7e7cc, #ead2ac 60%, #cfae7e);
      }
      .jar::after {
        /* wick */
        content: "";
        position: absolute;
        left: 50%;
        top: 4px;
        width: 3px;
        height: 16px;
        margin-left: -1.5px;
        border-radius: 2px;
        background: #20120f;
      }
      .label {
        position: absolute;
        left: 50%;
        top: 44px;
        z-index: 1;
        width: 54px;
        padding: 8px 0;
        transform: translateX(-50%);
        border-radius: 3px;
        background: #35193d;
        color: #f6e6d2;
        font-size: 11px;
        font-weight: 600;
        text-align: center;
      }
      .flame {
        position: absolute;
        left: 50%;
        top: -12px;
        width: 16px;
        height: 32px;
        margin-left: -8px;
        border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0) 0%,
          #ffd27a 35%,
          #ff8a2a 100%
        );
        box-shadow: 0 0 22px 8px rgba(255, 160, 60, 0.55);
      }

      /* ---------- 2. perfume ---------- */
      .perfume {
        --bg: #c9d3f2;
        --fg: #1d2240;
        background:
          radial-gradient(
            circle at 70% 25%,
            rgba(255, 255, 255, 0.7),
            transparent 45%
          ),
          var(--bg);
      }
      .bottle {
        width: 100px;
        height: 118px;
        margin-top: 40px;
        border-radius: 16px;
        background: linear-gradient(
          135deg,
          #f8d99a 0%,
          #e9a64c 55%,
          #c9782a 100%
        );
        box-shadow:
          inset 0 0 0 4px rgba(255, 255, 255, 0.55),
          inset -10px -12px 20px rgba(120, 60, 10, 0.3),
          0 22px 24px -14px rgba(29, 34, 64, 0.55);
      }
      .bottle::before {
        /* glass highlight */
        content: "";
        position: absolute;
        left: 14px;
        top: 14px;
        width: 10px;
        height: 72px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.6);
      }
      .bottle::after {
        /* neck */
        content: "";
        position: absolute;
        left: 50%;
        top: -14px;
        width: 30px;
        height: 16px;
        margin-left: -15px;
        border-radius: 4px 4px 0 0;
        background: linear-gradient(90deg, #b8bcc8, #f2f3f7 45%, #8f94a6);
      }
      .cap {
        position: absolute;
        left: 50%;
        top: -58px;
        width: 52px;
        height: 46px;
        margin-left: -26px;
        border-radius: 8px;
        background: linear-gradient(100deg, #3a4170, #1d2240 55%, #12162e);
        box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.2);
      }
      .tag {
        position: absolute;
        left: 50%;
        top: 46px;
        width: 58px;
        padding: 9px 0;
        transform: translateX(-50%);
        border-radius: 3px;
        background: #fbfaf7;
        color: #1d2240;
        font-size: 11px;
        font-weight: 600;
        text-align: center;
        line-height: 1.15;
      }

      /* ---------- 3. watch ---------- */
      .watch {
        --bg: #c5d4bd;
        --fg: #1f3326;
        background:
          radial-gradient(
            circle at 25% 20%,
            rgba(255, 255, 255, 0.5),
            transparent 50%
          ),
          var(--bg);
      }
      .wrist {
        width: 116px;
        height: 116px;
      }
      .strap {
        position: absolute;
        left: 50%;
        width: 60px;
        height: 86px;
        margin-left: -30px;
        background: linear-gradient(90deg, #1b2c21, #2f4a38 50%, #1b2c21);
      }
      .strap.up {
        top: -66px;
        border-radius: 14px 14px 0 0;
      }
      .strap.down {
        bottom: -66px;
        border-radius: 0 0 14px 14px;
      }
      .strap.down::after {
        /* buckle holes */
        content: "";
        position: absolute;
        left: 50%;
        top: 30px;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        border-radius: 50%;
        background: var(--bg);
        box-shadow:
          0 16px 0 var(--bg),
          0 32px 0 var(--bg);
        opacity: 0.75;
      }
      .case {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(135deg, #f1ece0, #b9b09c 55%, #e6dfcf);
        box-shadow: 0 14px 18px -8px rgba(31, 51, 38, 0.6);
      }
      .face {
        position: absolute;
        inset: 7px;
        border-radius: 50%;
        background: #f6f1e4;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.18);
      }
      .face::before {
        /* hour ticks */
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: repeating-conic-gradient(
          #1f3326 0 1.6deg,
          transparent 1.6deg 30deg
        );
        -webkit-mask: radial-gradient(circle, transparent 41px, #000 42px);
        mask: radial-gradient(circle, transparent 41px, #000 42px);
      }
      .hand {
        position: absolute;
        left: 50%;
        bottom: 50%;
        border-radius: 3px;
        background: #1f3326;
        transform-origin: 50% 100%;
      }
      .hand.h {
        width: 4px;
        height: 24px;
        margin-left: -2px;
        transform: rotate(-60deg);
      }
      .hand.m {
        width: 3px;
        height: 35px;
        margin-left: -1.5px;
        transform: rotate(60deg);
      }
      .face::after {
        /* centre pin */
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 9px;
        height: 9px;
        margin: -4.5px 0 0 -4.5px;
        border-radius: 50%;
        background: #d4552f;
      }
    </style>
  </head>
  <body>
    <article class="card candle">
      <h2 class="name">Ember No. 4</h2>
      <div class="art">
        <div class="jar" style="position: relative">
          <div class="flame"></div>
          <div class="label">No. 4</div>
        </div>
      </div>
      <p class="meta"><b>$24</b>Fig and cedar, 40 hr burn</p>
      <a class="add" href="#" aria-label="Add Ember No. 4 to cart">+</a>
    </article>

    <article class="card perfume">
      <h2 class="name">Salt &amp; Fig</h2>
      <div class="art">
        <div class="bottle" style="position: relative">
          <div class="cap"></div>
          <div class="tag">Salt<br />&amp; Fig</div>
        </div>
      </div>
      <p class="meta"><b>$72</b>Eau de parfum, 50 ml</p>
      <a class="add" href="#" aria-label="Add Salt and Fig to cart">+</a>
    </article>

    <article class="card watch">
      <h2 class="name">Field 38</h2>
      <div class="art">
        <div class="wrist" style="position: relative">
          <div class="strap up"></div>
          <div class="strap down"></div>
          <div class="case">
            <div class="face">
              <div class="hand h"></div>
              <div class="hand m"></div>
            </div>
          </div>
        </div>
      </div>
      <p class="meta"><b>$210</b>38 mm, leather strap</p>
      <a class="add" href="#" aria-label="Add Field 38 to cart">+</a>
    </article>
  </body>
</html>
